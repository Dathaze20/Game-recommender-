name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The runner image is pinned rather than tracking `ubuntu-latest`. When GitHub
# rolled `ubuntu-latest` to Ubuntu 26.04, `actions/setup-python` stopped being
# able to resolve Python 3.9 — `actions/python-versions` publishes no 3.9 build
# for that image, since 3.9 reached end of life in October 2025 — and the test
# matrix failed before running a single test. Pinning keeps CI reproducible and
# decoupled from image rollovers; see the matching pin in android.yml.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor declared in pyproject.toml (`requires-python`), so it
        # stays covered even though it is end-of-life upstream. 3.13 is here so
        # the current release is tested too.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Kivy is deliberately NOT installed here. Everything under `gamerec/`
      # outside `gamerec/ui/` is Kivy-free (asserted by tests/test_layering.py),
      # so the suite runs headless with no display server and no GL stack.
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q
