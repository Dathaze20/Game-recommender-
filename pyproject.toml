[project]
name = "game-recommender"
version = "1.0.0"
description = "Kivy game-discovery app powered by the RAWG API."
requires-python = ">=3.9"

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".venv", "venv", "build", "dist", ".buildozer"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplifications
]
ignore = [
    # The UI layer legitimately catches broad exceptions at thread and
    # shutdown boundaries; each site carries an explanatory comment.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# The entry point must configure Kivy before importing the app package.
"main.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:gamerec.*"]
